<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="'Noto Sans SC', system-ui, sans-serif">
  <!-- canvas -->
  <rect width="1120" height="760" fill="#FBFBFD"/>
  <text x="40" y="34" font-size="12" letter-spacing="2" fill="#9A9DA4">AI 新手启蒙课程 · 方向稿 Mockup（配色/字体/布局示意，非前端代码）</text>

  <!-- ============ LEFT: FIRST SCREEN ============ -->
  <rect x="20" y="52" width="540" height="688" rx="16" fill="#FFFFFF" stroke="#E6E8EC"/>
  <!-- brand mark + eyebrow -->
  <rect x="44" y="76" width="16" height="16" rx="4" fill="#0D9488"/>
  <text x="68" y="89" font-size="12" letter-spacing="2" fill="#6B6E76">AI 启蒙 · 职场提效</text>
  <!-- course title (serif) -->
  <text x="44" y="142" font-family="'Noto Serif SC', Georgia, serif" font-size="27" font-weight="590" fill="#1A1C20">AI 新手启蒙</text>
  <text x="44" y="178" font-family="'Noto Serif SC', Georgia, serif" font-size="27" font-weight="590" fill="#1A1C20">用对工具，每天省 2 小时</text>
  <!-- value prop -->
  <text x="44" y="214" font-size="14" fill="#6B6E76">写给从没用过 AI 的职场人：从对话到落地，</text>
  <text x="44" y="234" font-size="14" fill="#6B6E76">12 讲带你把 AI 用成可靠的提效搭子。</text>
  <!-- meta row with 16px icons -->
  <g stroke="#0D9488" stroke-width="1.75" fill="none">
    <circle cx="52" cy="266" r="7"/><path d="M52 262 v4 l3 3"/>
    <path d="M108 259 v3 a7 7 0 0 0 14 0 v-3"/><circle cx="115" cy="263" r="2.5" fill="#0D9488" stroke="none"/>
    <circle cx="184" cy="266" r="7"/><path d="M180 266 h8 M184 262 v8"/>
  </g>
  <text x="68" y="271" font-size="13" fill="#3A3D44">林知秋 · 讲师</text>
  <text x="128" y="271" font-size="13" fill="#3A3D44">职场新人/主管</text>
  <text x="200" y="271" font-size="13" fill="#3A3D44">约 3 小时</text>
  <!-- CTAs -->
  <rect x="44" y="300" width="200" height="46" rx="8" fill="#0D9488"/>
  <text x="144" y="328" font-size="15" font-weight="510" fill="#FFFFFF" text-anchor="middle">开始第一讲</text>
  <rect x="256" y="300" width="280" height="46" rx="8" fill="none" stroke="#E6E8EC"/>
  <text x="396" y="328" font-size="14" fill="#1A1C20" text-anchor="middle">在知识星球继续阅读</text>
  <!-- TOC -->
  <text x="44" y="382" font-size="12" letter-spacing="2" fill="#9A9DA4">课程目录</text>
  <!-- current item -->
  <rect x="44" y="396" width="492" height="40" rx="8" fill="#F3F5F7"/>
  <rect x="44" y="396" width="3" height="40" fill="#0D9488"/>
  <text x="62" y="421" font-size="14" font-weight="510" fill="#0D9488">第 1 讲　先搞懂 AI 能替你做什么</text>
  <text x="62" y="455" font-size="14" fill="#3A3D44">第 2 讲　选对工具：聊天 / 绘画 / 办公</text>
  <text x="62" y="489" font-size="14" fill="#3A3D44">第 3 讲　写出好提示词的 5 个套路</text>
  <text x="62" y="523" font-size="14" fill="#3A3D44">第 4 讲　让 AI 帮你写邮件与周报</text>
  <text x="62" y="557" font-size="14" fill="#3A3D44">第 5 讲　用 AI 整理资料与做 PPT</text>
  <text x="62" y="606" font-size="12" fill="#9A9DA4">共 12 讲 · 已更新至第 8 讲</text>

  <!-- ============ RIGHT: ARTICLE READING VIEW ============ -->
  <rect x="580" y="52" width="540" height="688" rx="16" fill="#FFFFFF" stroke="#E6E8EC"/>
  <!-- reading progress bar -->
  <rect x="580" y="52" width="540" height="3" fill="#E6E8EC"/>
  <rect x="580" y="52" width="216" height="3" fill="#0D9488"/>
  <!-- eyebrow + H2 (serif) -->
  <text x="604" y="100" font-size="12" letter-spacing="2" fill="#0D9488">第 1 讲</text>
  <text x="604" y="134" font-family="'Noto Serif SC', Georgia, serif" font-size="22" font-weight="590" fill="#1A1C20">先搞懂 AI 能替你做什么</text>
  <!-- body paragraphs (serif read, simulated lines) -->
  <g font-family="'Noto Serif SC', Georgia, serif" font-size="15" fill="#1A1C20">
    <text x="604" y="170">很多同事怕 AI，是因为把它想得太神、也太吓人。其实它最擅长</text>
    <text x="604" y="194">的，是「有明确输入、要稳定输出」的那类活。</text>
  </g>
  <g fill="#D9DCE0">
    <rect x="604" y="214" width="470" height="7" rx="3"/>
    <rect x="604" y="228" width="452" height="7" rx="3"/>
    <rect x="604" y="242" width="466" height="7" rx="3"/>
    <rect x="604" y="256" width="430" height="7" rx="3"/>
  </g>
  <!-- callout (surface-warm + accent left bar) -->
  <rect x="604" y="282" width="492" height="64" rx="12" fill="#F3F5F7"/>
  <rect x="604" y="282" width="3" height="64" fill="#0D9488"/>
  <text x="624" y="308" font-size="13" font-weight="510" fill="#1A1C20">记住一句话</text>
  <text x="624" y="330" font-size="13" fill="#3A3D44">AI 是协作者，不是替代者——先想清楚你要什么，再让它做。</text>
  <!-- inline image placeholder -->
  <rect x="604" y="366" width="492" height="118" rx="12" fill="#EEF0F2"/>
  <g stroke="#9A9DA4" stroke-width="1.75" fill="none">
    <path d="M744 448 l26 -22 20 16 18 -14 22 20"/>
    <circle cx="772" cy="412" r="8"/>
  </g>
  <text x="624" y="500" font-size="12" fill="#9A9DA4">图 1：AI 能力边界示意——把重复活交给它，把判断留给你</text>
  <!-- code / prompt block (dark) -->
  <rect x="604" y="524" width="492" height="84" rx="8" fill="#161A21"/>
  <rect x="604" y="524" width="492" height="84" rx="8" fill="none" stroke="#262C35"/>
  <text x="624" y="552" font-family="'JetBrains Mono', monospace" font-size="12" fill="#B8BDC7">你是一名资深行政助理。帮我把下面这封</text>
  <text x="624" y="572" font-family="'JetBrains Mono', monospace" font-size="12" fill="#B8BDC7">会议通知改写成更得体的版本：…</text>
  <rect x="1056" y="536" width="28" height="28" rx="6" fill="#0D9488"/>
  <text x="1070" y="555" font-size="12" fill="#FFFFFF" text-anchor="middle">⧉</text>
  <!-- footer next link -->
  <text x="604" y="650" font-size="14" font-weight="510" fill="#0D9488">下一篇：选对工具 →</text>
  <text x="604" y="700" font-size="12" fill="#9A9DA4">阅读进度自动保存 · 支持浅色 / 深色主题</text>
</svg>
