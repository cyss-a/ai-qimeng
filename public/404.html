<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面没找到 · AI 新手启蒙</title>
  <style>
    :root { --bg:#FBFBFD; --surface:#FFFFFF; --fg:#1A1C20; --muted:#6B6E76; --border:#E6E8EC; --accent:#0D9488; --accent-on:#FFFFFF; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: "Noto Sans SC", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; padding: 24px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 40px; max-width: 460px; width: 100%; text-align: center;
    }
    .mark { width: 40px; height: 40px; border-radius: 9px; background: var(--accent); margin: 0 auto 20px; }
    h1 { font-family: "Noto Serif SC", Georgia, serif; font-size: 24px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 24px; }
    a.btn {
      display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-on);
      padding: 12px 22px; border-radius: 8px; font-weight: 510; text-decoration: none; min-height: 44px;
    }
    a.btn:hover { background: #0F766E; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>这一讲还没找到</h1>
    <p>你访问的章节链接可能已调整。返回课程目录，从第一讲开始读起吧。</p>
    <a class="btn" href="/">返回课程目录</a>
  </main>
</body>
</html>
